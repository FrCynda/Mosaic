[package]
name = "mosaic-wrapper"
version = "2.0.0"
description = "Mosaic: fast NTFS file search (engine adapted from AllTheThings, MIT)"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
rayon = "1.10"
regex = "1.11"
bincode = "1.3"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["gif"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tantivy = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
drag = "2"
unicode-normalization = "0.1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1.4"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl",
    "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Globalization",
    "Win32_System_Console", "Win32_System_JobObjects",
] }
raw-window-handle = "0.6" # already in the tree (drag uses it): lets the native window start a file drag
# the native window draws with Direct2D + DirectWrite
windows61 = { package = "windows", version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common"] }
windows-numerics = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Media_MediaFoundation", "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_IndexServer", "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
