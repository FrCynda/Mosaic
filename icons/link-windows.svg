<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Windows 11's shortcut overlay, redrawn (measured off imageres.dll at 256 px): a framed white tile, a blue arrow -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9ECF1"/>
      <stop offset="1" stop-color="#C5CEDC"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="20" y1="18" x2="84" y2="82">
      <stop offset="0" stop-color="#26A6E6"/>
      <stop offset="1" stop-color="#0071D1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="7" fill="url(#frame)"/>
  <rect x="6" y="6" width="88" height="88" rx="3" fill="#FFFFFF"/>
  <path d="M22 77.5 L74 25.5" stroke="url(#blue)" stroke-width="12.4" stroke-linecap="round"/>
  <path d="M44.8 21.8 H77.8 V54.8" fill="none" stroke="url(#blue)" stroke-width="11.6" stroke-linecap="round" stroke-linejoin="miter"/>
</svg>
