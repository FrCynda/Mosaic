<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="badge">
      <rect x="0" y="0" width="256" height="256" rx="57" ry="57"/>
    </clipPath>
  </defs>

  <!-- 3x3 mosaic tiles, center row/column enlarged so the lens sits fully inside the middle tile;
       flush edge-to-edge and clipped to the rounded badge so no gap or corner shows -->
  <g clip-path="url(#badge)">
    <rect x="0"      y="0"      width="71.68"  height="71.68"  fill="#6ABAF1"/>
    <rect x="71.68"  y="0"      width="112.64" height="71.68"  fill="#317DCF"/>
    <rect x="184.32" y="0"      width="71.68"  height="71.68"  fill="#2657AA"/>
    <rect x="0"      y="71.68"  width="71.68"  height="112.64" fill="#2F9EB7"/>
    <rect x="71.68"  y="71.68"  width="112.64" height="112.64" fill="#183962"/>
    <rect x="184.32" y="71.68"  width="71.68"  height="112.64" fill="#2B9597"/>
    <rect x="0"      y="184.32" width="71.68"  height="71.68"  fill="#3E69A2"/>
    <rect x="71.68"  y="184.32" width="112.64" height="71.68"  fill="#3380CA"/>
    <rect x="184.32" y="184.32" width="71.68"  height="71.68"  fill="#76C6AF"/>
  </g>

  <!-- magnifying glass, sized to sit fully inside the enlarged middle tile -->
  <g>
    <circle cx="128" cy="128" r="44.8" fill="none" stroke="#FFFFFF" stroke-width="12.8"/>
    <line x1="161.0" y1="161.0" x2="187.9" y2="187.9" stroke="#FFFFFF" stroke-width="17.0" stroke-linecap="round"/>
  </g>
</svg>
